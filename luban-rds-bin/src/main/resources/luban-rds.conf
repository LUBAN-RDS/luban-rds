# LubanRDS 配置文件
# 参考 Redis 配置格式

################################## 网络配置 ##################################

# 绑定地址，默认绑定所有网卡
bind 0.0.0.0

# 监听端口，默认 9736
port 9736

# TCP 连接队列长度
tcp-backlog 511

# 客户端空闲超时时间（秒），0 表示禁用
timeout 0

# TCP keepalive 时间（秒）
tcp-keepalive 300

################################## 通用配置 ##################################

# 是否以守护进程方式运行
daemonize no

# 日志级别：debug, verbose, notice, warning
loglevel notice

# 日志文件路径，空字符串表示输出到标准输出
logfile ""

# 数据库数量
databases 16

################################## 持久化配置 ##################################

# 持久化模式：rdb, aof, mixed, none
# rdb - 使用 RDB 快照持久化
# aof - 使用 AOF 日志持久化
# mixed - 同时使用 RDB 和 AOF
# none - 不进行持久化
persist-mode rdb

# 数据目录
dir ./data

# RDB 文件名
dbfilename dump.rdb

# RDB 自动保存间隔（秒）
rdb-save-interval 60

# AOF 文件名
appendfilename appendonly.aof

# AOF 同步策略：always, everysec, no
# always - 每次写入都同步
# everysec - 每秒同步一次
# no - 由操作系统决定何时同步
appendfsync everysec

# AOF 同步间隔（秒），仅当 appendfsync 为 everysec 时有效
aof-fsync-interval 1

################################## 内存管理 ##################################

# 最大内存限制，0 表示不限制
# 支持单位：b, kb, mb, gb
maxmemory 0

# 内存淘汰策略
# noeviction - 不淘汰，内存满时返回错误
# allkeys-lru - 从所有键中淘汰最近最少使用的
# volatile-lru - 从设置了过期时间的键中淘汰最近最少使用的
# allkeys-random - 从所有键中随机淘汰
# volatile-random - 从设置了过期时间的键中随机淘汰
# volatile-ttl - 从设置了过期时间的键中淘汰即将过期的
maxmemory-policy noeviction

################################## 安全配置 ##################################

# 访问密码，空字符串表示不需要密码
requirepass ""

################################## 多线程配置 ##################################

# I/O 线程数，0 表示自动检测（CPU 核心数 * 2）
io-threads 0

# Worker 线程数，0 表示自动检测（CPU 核心数 * 2）
worker-threads 0

# 业务线程数，0 表示自动检测（CPU 核心数）
business-threads 0

################################## 内存优化配置 ##################################

# 是否使用内存池
use-pool yes

# 内存碎片率阈值（百分比），超过此值自动触发碎片整理
memory-frag-threshold 30

################################## Lua 配置 ##################################

# Lua 脚本执行超时时间（毫秒），默认 5000
lua-timeout 10000

# 是否启用 Lua 沙箱模式，默认 yes
# lua-sandbox-enabled yes

# Lua 脚本最大字节数，默认 65536
# lua-max-script-bytes 65536

# Lua 脚本最大返回字节数，默认 1048576
# lua-max-return-bytes 1048576

################################## 集群配置 ##################################

# 是否启用集群模式，默认 no
# cluster-enabled yes

# 集群配置文件路径，节点信息会自动保存到此文件
# cluster-config-file nodes.conf

# 节点超时时间（毫秒），默认 15000
# 节点间通信超时时间，超过此时间未收到响应则认为节点下线
# cluster-node-timeout 15000

# 集群自动故障转移退避窗口（毫秒），默认 0
# slave 检测到 master FAIL 后，等待该时长 + 随机抖动(0-500ms) 再发起选举
# cluster-failover-grace-period 0

# 对外宣布的 IP 地址，默认自动检测
# 在多网卡或 NAT 环境下需要手动设置
# cluster-announce-ip ""

# 对外宣布的服务端口，默认使用 port 配置
# cluster-announce-port 0

# 对外宣布的集群总线端口，默认为服务端口 + 10000
# cluster-announce-bus-port 0

# 从节点有效性因子，默认 10
# 用于计算从节点可以参与故障转移的最大时间
# cluster-slave-validity-factor 10

# 迁移屏障，默认 1
# 主节点至少需要保留的从节点数量才能迁移槽位
# cluster-migration-barrier 1

# 是否需要全部槽位覆盖，默认 yes
# 如果设置为 no，则集群在部分槽位不可用时仍可提供服务
# cluster-require-full-coverage yes
